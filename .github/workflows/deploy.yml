
name: Build and Deploy

# Manual-only until the template is complete.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: deployment-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      - name: Update Compose image
        run: |
          grep -q '# DEPLOY_IMAGE' compose.yaml

          sed -i -E \
            "s|^([[:space:]]*image:)[[:space:]]+.*[[:space:]]+# DEPLOY_IMAGE$|\1 ${IMAGE}:${GITHUB_SHA} # DEPLOY_IMAGE|" \
            compose.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add compose.yaml

          if ! git diff --cached --quiet; then
            git commit -m "Deploy image ${GITHUB_SHA}"
            git push
          fi
